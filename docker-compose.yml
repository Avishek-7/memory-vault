services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: memory_vault
      POSTGRES_PASSWORD: memory_vault
      POSTGRES_DB: memory_vault
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the pgvector extension and the unprivileged memory_vault_app
      # role the server connects as. Runs only on first initialization of an
      # empty data directory — an existing deployment upgrading to
      # multi-tenancy has to apply it by hand (see README).
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_vault"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: pulls the embedding and chat models into ollama's volume.
  # The base ollama image ships with no models pre-pulled, so first
  # startup takes a few minutes while these download.
  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-all-minilm}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull \"$$OLLAMA_EMBED_MODEL\" && ollama pull \"$$OLLAMA_CHAT_MODEL\""
    depends_on:
      ollama:
        condition: service_healthy

  memory-vault:
    build: .
    restart: unless-stopped
    # Bound to loopback only: AUTH_TOKEN is unset by default in this
    # quickstart, so publishing to all interfaces would mean an
    # unauthenticated MCP server reachable from the network (or the
    # internet, on a cloud host). Change to "8080:8080" if you need
    # non-local access, and set AUTH_TOKEN/ALLOWED_HOSTS in .env first.
    ports:
      - "127.0.0.1:8080:8080"
    # AUTH_TOKEN, ALLOWED_HOSTS, and the Ollama model names come from
    # .env (copy .env.example to get started). DATABASE_URL/OLLAMA_URL
    # below always point at the other compose services and override
    # whatever's in .env, since those two only make sense as
    # container-network addresses in this setup.
    env_file:
      - path: .env
        required: false
    environment:
      # memory_vault_app, not memory_vault: POSTGRES_USER is a superuser and
      # superusers bypass row-level security, which would silently disable
      # tenant isolation. deploy/init-db.sql creates this role; the server
      # refuses to start if handed a privileged one.
      DATABASE_URL: postgres://memory_vault_app:memory_vault_app@postgres:5432/memory_vault?sslmode=disable
      OLLAMA_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    # No healthcheck here: the image is FROM scratch (no shell, no
    # curl/wget) by design, so there's nothing a HEALTHCHECK CMD could
    # run inside the container. `depends_on` above already sequences
    # startup after Postgres is ready and models are pulled.

volumes:
  postgres-data:
  ollama-data:
